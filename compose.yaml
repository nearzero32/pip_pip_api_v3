services:
  postgres:
    image: pip_pip_v3/postgis:17-3.5
    build:
      context: ./docker/postgres-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: pip_pip_v3
      POSTGRES_USER: pip_pip_dev
      POSTGRES_PASSWORD: pip_pip_dev_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pip_pip_dev -d pip_pip_v3"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - pip_pip_v3_postgres:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    ports:
      - "6380:6379"

  api:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: info
      DATABASE_URL: postgresql://pip_pip_dev:pip_pip_dev_only@postgres:5432/pip_pip_v3
      DATABASE_POOL_SIZE: 10
      DATABASE_CONNECTION_TIMEOUT_MS: 5000
      GRACEFUL_SHUTDOWN_TIMEOUT_MS: 10000
      REDIS_URL: redis://redis:6379
      OTP_DELIVERY_ADAPTER: development
      SECRET_VERIFIER_KEY: development-only-verifier-key-change-me-32chars
      SECRET_VERIFIER_KEY_VERSION: v1
      JWT_ISSUER: pip-pip-api-v3-development
      JWT_KEY_ID: dev-ed25519-v1
      JWT_PRIVATE_KEY_BASE64: MC4CAQAwBQYDK2VwBCIEIOhYjslG5wawzghWHcQbYCMjFp8kzMYLVFZoKEOBzTA4
      JWT_PUBLIC_KEY_BASE64: MCowBQYDK2VwAyEA+ly2CeP4N1AQ5vNUEt226L6GtOMU/uLE2rjFfo4OBCE=
      ACCESS_TOKEN_LIFETIME_SECONDS: 600
      ARGON2_MEMORY_COST: 65536
      ARGON2_TIME_COST: 3
      ARGON2_PARALLELISM: 1
      OSRM_BASE_URL: ${OSRM_BASE_URL:-http://host.docker.internal:5000}
      OSRM_PROFILE: ${OSRM_PROFILE:-driving}
      OSRM_TIMEOUT_MS: ${OSRM_TIMEOUT_MS:-3000}
      DELIVERY_PRICING_CACHE_TTL_SECONDS: ${DELIVERY_PRICING_CACHE_TTL_SECONDS:-21600}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_BUCKET: ${R2_BUCKET}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL}
      R2_UPLOAD_URL_TTL_SECONDS: ${R2_UPLOAD_URL_TTL_SECONDS:-300}
      MEDIA_MAX_IMAGE_BYTES: ${MEDIA_MAX_IMAGE_BYTES:-5242880}
      MEDIA_UNATTACHED_TTL_HOURS: ${MEDIA_UNATTACHED_TTL_HOURS:-24}
      MEDIA_CLEANUP_INTERVAL_SECONDS: ${MEDIA_CLEANUP_INTERVAL_SECONDS:-900}
      MEDIA_DELETE_LEASE_SECONDS: ${MEDIA_DELETE_LEASE_SECONDS:-300}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:3000/health/live');if(!r.ok)process.exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "3000:3000"
    stop_grace_period: 15s

  migrate:
    build: .
    restart: "no"
    command: ["bun", "run", "db:migrate:prod"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://pip_pip_dev:pip_pip_dev_only@postgres:5432/pip_pip_v3
      DATABASE_POOL_SIZE: 10
      DATABASE_CONNECTION_TIMEOUT_MS: 5000
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pip_pip_v3_postgres:
