services:
  db:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pip_pip_v3
      POSTGRES_USER: pip_pip_dev
      POSTGRES_PASSWORD: pip_pip_dev_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pip_pip_dev -d pip_pip_v3"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - pip_pip_v3_postgres:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  api:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: info
      DATABASE_URL: postgresql://pip_pip_dev:pip_pip_dev_only@db:5432/pip_pip_v3
      DATABASE_POOL_SIZE: 10
      DATABASE_CONNECTION_TIMEOUT_MS: 5000
      GRACEFUL_SHUTDOWN_TIMEOUT_MS: 10000
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:3000/health/live');if(!r.ok)process.exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "3000:3000"
    stop_grace_period: 15s

  migrate:
    build: .
    restart: "no"
    command: ["bun", "run", "db:migrate:prod"]
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: info
      DATABASE_URL: postgresql://pip_pip_dev:pip_pip_dev_only@db:5432/pip_pip_v3
      DATABASE_POOL_SIZE: 10
      DATABASE_CONNECTION_TIMEOUT_MS: 5000
      GRACEFUL_SHUTDOWN_TIMEOUT_MS: 10000
    depends_on:
      db:
        condition: service_healthy

volumes:
  pip_pip_v3_postgres:
